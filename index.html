    <title>Aplikasi Guru AI</title>
    <script>
      (function() {
        try {
          var targetObj = typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : this);
          if (targetObj) {
            var nativeFetch = typeof targetObj.fetch === 'function' ? targetObj.fetch.bind(targetObj) : null;
            var currentFetch = nativeFetch;
            var fetchDescriptor = {
              get: function() {
                return currentFetch || (nativeFetch ? nativeFetch : (typeof fetch === 'function' ? fetch.bind(targetObj) : undefined));
              },
              set: function(val) {
                if (typeof val === 'function') {
                  currentFetch = val;
                }
              },
              configurable: true,
              enumerable: true
            };

            try {
              Object.defineProperty(targetObj, 'fetch', fetchDescriptor);
            } catch (e1) {
              try {
                if (typeof Window !== 'undefined' && Window.prototype) {
                  Object.defineProperty(Window.prototype, 'fetch', fetchDescriptor);
                }
              } catch (e2) {}
            }

            if (typeof globalThis !== 'undefined' && globalThis !== targetObj) {
              try {
                Object.defineProperty(globalThis, 'fetch', fetchDescriptor);
              } catch (e3) {}
            }
          }
        } catch (err) {
          console.warn('Fetch compatibility notice:', err);
        }
      })();
    </script>
